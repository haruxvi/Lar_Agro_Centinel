name: Backend Quality Gates

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.bandit'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'backend/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.bandit'
      - '.github/workflows/backend-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Decided in docs/decisions/ADR-001-python-version.md
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system deps for geospatial
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff (linting)
        run: ruff check backend/

      - name: MyPy (type checking strict)
        run: mypy backend/app/ --config-file pyproject.toml

      - name: Bandit (SAST)
        run: bandit -r backend/ -c .bandit --severity-level high

      - name: Pip-audit (dependencies CVEs)
        run: pip-audit -r requirements.txt

      - name: Pytest with coverage
        run: pytest backend/tests/ -v --cov=backend/app --cov-report=xml
