name: Backend Quality Gates

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.bandit'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'backend/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.bandit'
      - '.github/workflows/backend-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real PostgreSQL with PostGIS, the same
      # major version as production.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: lar_agro_centinel_test
          POSTGRES_USER: lar_owner
          POSTGRES_PASSWORD: lar_owner_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lar_owner -d lar_agro_centinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Decided in docs/decisions/ADR-001-python-version.md
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system deps for geospatial
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create the runtime database role
        env:
          PGPASSWORD: lar_owner_password
        run: psql -h localhost -U lar_owner -d lar_agro_centinel_test -v ON_ERROR_STOP=1 -f scripts/init-db.sql

      - name: Verify frontend role constants are in sync
        run: python scripts/generate_frontend_roles.py --check

      - name: Verify frontend enum constants are in sync
        run: python scripts/generate_frontend_enums.py --check

      - name: Ruff (linting)
        run: ruff check backend/

      - name: MyPy (type checking strict)
        run: mypy backend/app/ --config-file pyproject.toml

      - name: Bandit (SAST)
        run: bandit -r backend/ -c .bandit --severity-level high

      - name: Pip-audit (dependencies CVEs)
        run: pip-audit -r requirements.txt

      - name: Pytest with coverage
        env:
          # Migrations run as the schema owner, the suite also connects as the
          # runtime role to prove the audit_log privileges hold.
          TEST_DATABASE_URL: postgresql+psycopg://lar_owner:lar_owner_password@localhost:5432/lar_agro_centinel_test
          TEST_APP_DATABASE_URL: postgresql+psycopg://lar_app:lar_app_password@localhost:5432/lar_agro_centinel_test
          REDIS_URL: redis://localhost:6379/15
        run: pytest backend/tests/ -v --cov=backend/app --cov-report=xml
