[project]
name = "agrovista-backend"
version = "0.2.0"
description = "AgroVista precision agriculture platform - backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ANN", "S", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_any_explicit = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["rasterio.*", "shapely.*", "geopandas.*", "sentinelhub.*"]
ignore_missing_imports = true
